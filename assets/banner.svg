<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#121826"/>
      <stop offset="100%" stop-color="#1a233a"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f00ff"/>
      <stop offset="100%" stop-color="#e100ff"/>
    </linearGradient>

    <radialGradient id="shield-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Tech Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/>

  <!-- Cyber Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Animated Glowing Halo -->
  <circle cx="220" cy="200" r="130" fill="url(#shield-halo)">
    <animate attributeName="r" values="110;140;110" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Dynamic Security Tech Circles -->
  <g transform="translate(220, 200)">
    <!-- Outer Rotating Ring -->
    <circle cx="0" cy="0" r="90" fill="none" stroke="url(#cyan-glow)" stroke-width="2" stroke-dasharray="12 8 4 8" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
    </circle>
    <!-- Inner Counter-rotating Ring -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="url(#purple-glow)" stroke-width="2" stroke-dasharray="20 10 5 10">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="8s" repeatCount="indefinite"/>
    </circle>

    <!-- Shield & Key Emblem -->
    <path d="M-30,-40 L30,-40 L40,-10 C40,30 0,55 0,55 C0,55 -40,30 -40,-10 Z" fill="#121826" stroke="url(#cyan-glow)" stroke-width="3.5" filter="url(#glow)"/>
    <!-- Lock Keyhole Icon -->
    <circle cx="0" cy="-5" r="10" fill="none" stroke="#00f2fe" stroke-width="3"/>
    <path d="M-4, -5 L4, -5 L6, 18 L-6, 18 Z" fill="#00f2fe"/>
    <circle cx="0" cy="-5" r="4" fill="#121826"/>
  </g>

  <!-- Dynamic Connection Rays & Moving Data Packets -->
  <g stroke="url(#cyan-glow)" stroke-width="1.5" opacity="0.6">
    <line x1="310" y1="200" x2="450" y2="200" stroke-dasharray="6 4"/>
    <line x1="285" y1="135" x2="420" y2="100" stroke-dasharray="6 4"/>
    <line x1="285" y1="265" x2="420" y2="300" stroke-dasharray="6 4"/>
  </g>

  <!-- Moving Data Packets -->
  <circle cx="310" cy="200" r="4" fill="#00f2fe" filter="url(#glow)">
    <animate attributeName="cx" values="310;450;310" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="285" cy="135" r="4" fill="#e100ff" filter="url(#glow)">
    <animate attributeName="cx" values="285;420;285" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="135;100;135" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Header & Title Text -->
  <g transform="translate(460, 0)">
    <!-- Badge Pill -->
    <rect x="0" y="70" width="220" height="32" rx="16" fill="#00f2fe" fill-opacity="0.12" stroke="#00f2fe" stroke-width="1.5"/>
    <text x="110" y="91" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">
      AWESOME PKI 2026
    </text>

    <!-- Main Title -->
    <text x="0" y="155" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.5">
      Public Key Infrastructure
    </text>
    <text x="0" y="205" fill="url(#cyan-glow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="700" filter="url(#glow)">
      &amp; Machine Identity Platform
    </text>

    <!-- Subtitle -->
    <text x="0" y="255" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      Curated Ecosystem of Certificate Authorities, CLM, X.509 &amp; Trust Services
    </text>

    <!-- Pill Badges -->
    <g transform="translate(0, 285)">
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="65" y="18" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Enterprise CA</text>

      <rect x="140" y="0" width="150" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="215" y="18" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Certificate Lifecycle</text>

      <rect x="300" y="0" width="140" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="370" y="18" fill="#4ade80" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Open-Source CA</text>
    </g>
  </g>
</svg>
